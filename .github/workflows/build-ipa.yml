name: Build IPA

# 可选签名 Secrets（不配置时输出未签名 IPA）：
# BUILD_CERTIFICATE_BASE64, P12_PASSWORD, PROVISIONING_PROFILE_BASE64, TEAM_ID
# 可选：KEYCHAIN_PASSWORD、CODE_SIGN_IDENTITY（默认 Apple Development）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' && secrets.TEAM_ID != '' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app | grep -vi 'beta' | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          IDENTITY="${SIGNING_IDENTITY:-Apple Development}"
          xcodebuild archive \
            -project simpfun.xcodeproj \
            -scheme simpfun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/simpfun.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Archive (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild archive \
            -project simpfun.xcodeproj \
            -scheme simpfun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/simpfun.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          ditto "build/simpfun.xcarchive/Products/Applications/simpfun.app" "build/Payload/simpfun.app"

          ICON="simpfun/Assets.xcassets/AppIcon.appiconset/simpfun-light.png"
          sips -z 512 512 "$ICON" --out build/iTunesArtwork >/dev/null
          cp "$ICON" build/iTunesArtwork@2x

          cd build
          zip -qry simpfun.ipa Payload iTunesArtwork iTunesArtwork@2x
          cd ..

          if [ "$HAS_SIGNING" = "true" ]; then
            test -f build/Payload/simpfun.app/embedded.mobileprovision
          fi

          ls -lh build/simpfun.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: simpfun-ipa
          path: build/simpfun.ipa
          if-no-files-found: error
          retention-days: 30
